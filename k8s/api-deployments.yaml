apiVersion: v1
kind: Service
metadata:
  name: guajira-api
spec:
  selector:
    app: guajira-api
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guajira-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guajira-api
  template:
    metadata:
      labels:
        app: guajira-api
    spec:
      containers:
      - name: api
        image: salud-distribuida-api:latest
        imagePullPolicy: Never
        env:
        - name: COUCHDB_USER
          value: admin
        - name: COUCHDB_PASSWORD
          value: admin
        - name: COUCHDB_HOST
          value: guajira-db
        - name: COUCHDB_PORT
          value: "5984"
        - name: NODO_NAME
          value: "La Guajira"
        - name: ETCD_HOST
          value: "http://etcd-0.etcd:2379"
        ports:
        - containerPort: 5000
---

apiVersion: v1
kind: Service
metadata:
  name: guajira-db
spec:
  selector:
    app: guajira-db
  ports:
  - protocol: TCP
    port: 5984
    targetPort: 5984
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guajira-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guajira-db
  template:
    metadata:
      labels:
        app: guajira-db
    spec:
      containers:
      - name: couchdb
        image: couchdb:latest
        env:
        - name: COUCHDB_USER
          value: admin
        - name: COUCHDB_PASSWORD
          value: admin
        ports:
        - containerPort: 5984
        volumeMounts:
        - name: data
          mountPath: /opt/couchdb/data
      volumes:
      - name: data
        emptyDir: {}
---

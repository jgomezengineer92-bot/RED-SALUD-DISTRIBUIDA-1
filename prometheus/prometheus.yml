# =====================================================================
# RED SALUD DISTRIBUIDA — Prometheus Configuration
# Requisito 5.3: Stack de observabilidad
# CORREGIDO: CouchDB ahora usa couchdb-exporter (formato Prometheus válido)
# =====================================================================
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  # Flask API Nodes (métricas via prometheus_flask_exporter)
  - job_name: 'flask-apis'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'guajira_api:5000'
          - 'amazonas_api:5000'
          - 'guainia_api:5000'
          - 'narino_api:5000'
        labels:
          service: 'api-clinica'

  # CouchDB Nodes — via couchdb-prometheus-exporter (puerto 9984)
  # El exporter traduce de JSON nativo de CouchDB al formato de texto Prometheus
  - job_name: 'couchdb'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'couchdb-exporter-guajira:9984'
          - 'couchdb-exporter-amazonas:9984'
          - 'couchdb-exporter-guainia:9984'
          - 'couchdb-exporter-narino:9984'
        labels:
          service: 'couchdb'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
